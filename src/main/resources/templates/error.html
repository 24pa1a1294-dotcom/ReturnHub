<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Page Not Found')}"></head>

<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="main-content">
        <div class="container" style="text-align: center; padding: 5rem 1.5rem;">
            <div style="width: 5rem; height: 5rem; background-color: var(--primary-50); color: var(--primary-600); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 2.25rem; margin: 0 auto 1.5rem auto;">
                <i class="fas fa-compass-drafting"></i>
            </div>
            <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--slate-900); margin-bottom: 0.75rem;">Oops! Lost in Transit</h1>
            <p style="font-size: 1.1rem; color: var(--slate-600); max-width: 500px; margin: 0 auto 2rem auto;">
                The page or item you are looking for does not exist, has been removed, or is temporarily unavailable.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="fas fa-house"></i> Return to Homepage
                </a>
                <a th:href="@{/lost-items}" class="btn btn-outline">
                    Browse Lost Directory
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
