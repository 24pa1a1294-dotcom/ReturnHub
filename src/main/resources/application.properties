spring.application.name=Return Hub - Lost and Found

# ===================================================================
# Server Port (Dynamic Cloud Port Binding)
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# Database Configuration (MySQL via Environment Variables)
# ===================================================================
# Supports Railway, Render, Docker, and local development seamlessly
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/returnhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${MYSQLUSER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQLPASSWORD:1234}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===================================================================
# File Uploads (for item pictures)
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
returnhub.upload.dir=uploads

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
